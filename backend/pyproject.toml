[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samfscon"
# Not a literal. The version is stated in samfscon/__init__.py and read from
# there, so the two cannot disagree — which is the only failure this arrangement
# is for. SAMADCON shipped a release announcing itself as the previous one
# because three files carried the number and the release commit raised two;
# every installation then reported the wrong version at its sign-in screen, at
# /api/v1/health and to the CLI, and it was a reader who noticed.
#
# setuptools *parses* the file for the attribute rather than importing it, which
# is what keeps the samba bindings out of the build.
dynamic = ["version"]
description = "SAMFSCON — Samba FileServer Console: shares, permissions, sessions and local accounts over SMB and DCE/RPC"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

# Deliberately short. The one heavyweight dependency is NOT listed here because
# it comes from the distribution and must not be pulled from PyPI:
#   * samba (python3-samba) — no PyPI equivalent exists, and it is what every
#     protocol in this application is spoken through.
# The floors are what a pinned install would get, and they are audited as such
# in CI. They were not, until the audit ran for the first time and found
# sixteen advisories under them — none of which an audit of the *installed*
# packages could ever have seen, because `>=` resolves to the newest release
# and a fresh build was therefore never exposed. What is exposed is a machine
# that installed months ago, and anyone pinning from these constraints.
dependencies = [
    "fastapi>=0.141.1",
    # Declared even though fastapi brings it, for two reasons: it is imported
    # directly (api/v1/servers.py uses run_in_threadpool), so it belongs here
    # anyway; and fastapi's own floor permits starlette versions carrying eight
    # advisories. Ours has to be its own.
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

# Removed rather than raised: python-multipart. It was declared from the start
# and nothing ever used it — this application has no endpoint that takes a
# multipart body, no UploadFile, no Form. Seven of the sixteen advisories were
# against its floor, and raising the floor of something nothing imports would
# have been maintaining a dependency for the sake of the audit passing.

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
samfsconctl = "samfscon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "samfscon.__version__" }

[tool.setuptools.packages.find]
include = ["samfscon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live Samba file server (SAMFSCON_TARGET=test, see the README)",
    "shares: creates and deletes shares on the test server",
    # Needs the repository working tree rather than the installed package. The
    # shipped image carries the backend and the *built* bundle, so a check that
    # reads frontend source has nothing to read there — and the suite has to
    # stay runnable inside the image, which is where CI runs it.
    "repo: needs the repository checkout, not just what ships",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    # Samba's python bindings hand us bytes/str mixtures that read badly when
    # forced into ternaries.
    "SIM108",
    # Our exception names read as sentences at the call site (raise NotFound,
    # raise Conflict). SamfsconError is the one that carries the suffix.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in parameter defaults is the framework's idiom, not a
# mutable-default bug.
"samfscon/api/*" = ["B008"]
"samfscon/auth/deps.py" = ["B008"]
# Tests reach into internals on purpose and use long assertion lines.
"tests/*" = ["E501", "SLF001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
# The samba bindings are untyped C extensions.
[[tool.mypy.overrides]]
module = ["samba.*"]
ignore_missing_imports = true
