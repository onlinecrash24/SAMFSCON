<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The favicon carries its own dark plate, so one theme-color fits both. -->
    <meta name="theme-color" content="#161826" />
    <title>SAMFSCON — Samba FileServer Console</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Where dialogs, windows and menus are portalled to. Outside #root on
         purpose: an overlay rendered inside a positioned window would resolve
         its z-index within that window and paint underneath the one in front.
         Missing, everything still works — React falls back to document.body —
         right up until a dialog opens from a window, which is the worst way
         for a thing to be absent. -->
    <div id="overlays"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
