# Security headers, included at every level that sets an add_header of its own.
#
# nginx inherits add_header from an enclosing block *only if the inner block
# declares none*. The two static locations each set a Cache-Control, and that
# single directive silently dropped every header from the server block — so the
# HTML page, which is the one document where CSP and X-Frame-Options actually
# matter, went out with nothing but `cache-control: no-cache`, while the API
# had all of them. Kept in one file so the three places cannot drift apart.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
