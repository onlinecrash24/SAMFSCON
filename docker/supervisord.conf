; SAMFSCON process supervision.
;
; Two processes: the FastAPI backend and the nginx front end. Both log to the
; container's stdout/stderr so `docker logs` shows everything. Runs
; unprivileged, hence the socket and pid file below /run/samfscon.

[supervisord]
nodaemon=true
user=samfscon
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/samfscon/supervisord.pid
childlogdir=/var/log/samfscon

[unix_http_server]
file=/run/samfscon/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/samfscon/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api]
command=/opt/venv/bin/uvicorn samfscon.main:app
    --host 127.0.0.1
    --port 8000
    --proxy-headers
    --forwarded-allow-ips 127.0.0.1
    --no-server-header
directory=/opt/samfscon
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/samfscon/nginx.conf
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
; Starts after the API so the first request does not hit a closed upstream.
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
