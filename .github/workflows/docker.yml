# Build SAMFSCON and publish the image to the GitHub container registry.
#
# The tests run first and the image is only published if they pass. Publishing
# an image that fails its own suite is the failure this ordering prevents —
# and the unit tests are the half that needs no file server, so they run
# anywhere.
#
# The integration tests are deliberately not here. They create and delete
# shares and local accounts on a real server; a runner has none, and pointing
# one at a real file server from CI is not something to arrange by accident.

name: Docker

# Two builds per release, not three. A version reaches main and is tagged in
# the same breath, so a `main` trigger beside the tag one built the same
# commit twice — and the two builds produced different digests, leaving
# `latest` and the version tag pointing at images that were identical in
# content and not the same object. Releasing means tagging; the tag build
# carries `latest`, because metadata-action counts a tag as the default branch.
on:
  push:
    branches: [DEV]
    tags: ["v*"]
  pull_request:
    branches: [DEV, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner's default docker driver cannot export a build cache. The
      # container driver can, and still loads the built image into the local
      # store so the next step can run it.
      - uses: docker/setup-buildx-action@v3

      # The `test` stage of the Dockerfile is the runtime image plus pytest and
      # the suite, so the tests run against exactly what ships rather than
      # against a separately installed set of dependencies.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: samfscon:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --entrypoint skips the container's start-up — certificate generation,
      # nginx templating, krb5.conf — none of which a test run needs.
      - name: Unit tests
        run: docker run --rm --entrypoint python samfscon:test -m pytest tests/unit -q -m "not repo"

      # The `repo` ones read the front end's message catalogue, to check that
      # every code the backend can emit has a sentence in both languages. The
      # image carries the built bundle and no source, so the checkout is
      # mounted for this one run — read-only, and beside the suite rather than
      # inside it, because what is being checked is that the two halves of the
      # repository agree and not that the artefact is sound.
      #
      # Deselected above rather than skipped when the file is missing: a run
      # that was meant to check must not report a pass having checked nothing.
      - name: The two halves agree
        run: |
          docker run --rm --entrypoint python -v "${{ github.workspace }}/frontend:/opt/frontend:ro" samfscon:test -m pytest tests/unit -q -m repo

      # The frontend half. Run on the runner rather than in the image, because
      # the shipped image contains the built bundle and no node — building a
      # second image just to run these would cost more than it proves.
      #
      # Node environment, no DOM: what is tested is the logic the screens share
      # and the validation of anything read back out of browser storage. Layout,
      # pointer and stacking behaviour are checked in a real browser, because a
      # stand-in DOM reports zeros for every measurement and the tests would
      # only be asserting against the stand-in.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend unit tests
        run: npm ci --prefix frontend && npm run test --prefix frontend

      # The opposite of the step above: this one runs the start-up and nothing
      # else. `nginx -t` as the command means the entrypoint does its whole job
      # first — certificate, krb5.conf, the real-ip snippet, the templating —
      # and nginx then judges the result. A template that no longer parses is
      # not something a python test can see, and it reaches a running container
      # as a service that will not start.
      - name: The rendered nginx configuration parses
        run: |
          docker run --rm samfscon:test nginx -t -c /etc/samfscon/nginx.conf

      # Again with a proxy named, because that path emits directives the empty
      # one does not — including an include whose file only exists if the
      # entrypoint wrote it.
      - name: ... and still parses with a trusted proxy configured
        run: |
          docker run --rm -e SAMFSCON_TRUSTED_PROXIES='10.0.0.0/8, 192.168.1.2'             samfscon:test nginx -t -c /etc/samfscon/nginx.conf

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ruff needs none of the Samba bindings, so it runs here rather than in
      # the image — seconds instead of a container build.
      - name: Install ruff
        run: pip install "ruff>=0.5" pip-audit

      - name: Check
        working-directory: backend
        run: ruff check samfscon tests

      # scripts/ sits outside backend/ and would otherwise go unlinted. The
      # config has to be named: ruff looks *upward* from the files it is given,
      # and from the repository root there is nothing above it to find.
      - name: Check the scripts
        run: ruff check --config backend/pyproject.toml scripts

      # The version is stated in one file. This is what stops the others
      # drifting from it — and on a tag build, what catches a tag pushed
      # without raising anything at all.
      - name: The version agrees with itself
        env:
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/check_versions.py

      # What a build gets today.
      - name: Audit the dependencies as declared
        run: |
          python scripts/dependency_requirements.py > /tmp/declared.txt
          pip-audit --strict -r /tmp/declared.txt

      # And what the constraints still permit. This is the one nothing else
      # asks: `>=` resolves to the newest release, so a fresh build is never
      # exposed by a floor that is too low — the machine that installed months
      # ago is, and so is anyone who pins from these constraints.
      - name: Audit the floors
        run: |
          python scripts/dependency_requirements.py --floors > /tmp/floors.txt
          pip-audit --strict -r /tmp/floors.txt

  publish:
    name: Publish to ghcr.io
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Nothing is published from a pull request: the token has no write access
    # there, and an image built from unreviewed code should not carry a tag
    # anyone might pull.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The runner's default docker driver cannot export a build cache. The
      # container driver can, and still loads the built image into the local
      # store so the next step can run it.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `main` carries the releases, `DEV` carries the work in progress.
          #
          # The branch name is not used as a tag directly: it would publish
          # `DEV` in capitals, and an image tag people type by hand should not
          # depend on how a branch happens to be spelled. `dev` is set
          # explicitly instead, and `latest` follows the default branch, which
          # is `main`.
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/DEV' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # The product, not the test image: pytest and the suite have no place
          # in something people deploy.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
